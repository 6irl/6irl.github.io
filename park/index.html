<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic in Progress | Coming Soon</title>
    <!-- Importing elegant serif for headings and quirky sans-serif for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Karla:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #1a1525;
            --text-main: #e6e1db;
            --accent-gold: #d4af37;
            --accent-purple: #6a4c93;
            --card-bg: rgba(30, 24, 43, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d0a14 0%, #1a1525 50%, #2a1f3d 100%);
            color: var(--text-main);
            font-family: 'Karla', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Subtle starry background effect */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
                radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.15) 2px, transparent 2px),
                radial-gradient(circle at 50% 80%, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            pointer-events: none;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5),
                        inset 0 0 20px rgba(106, 76, 147, 0.2);
            text-align: center;
            max-width: 500px;
            width: 85%;
            position: relative;
            z-index: 1;
        }

        .mystic-icon {
            font-size: 3rem;
            color: var(--accent-gold);
            margin-bottom: 1rem;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); text-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            margin: 0 0 1rem 0;
            letter-spacing: 2px;
            color: var(--accent-gold);
        }

        .subtitle {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .quirky-text {
            font-style: italic;
            color: #a89bc0;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .social-links {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .social-links a {
            color: var(--text-main);
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .social-links a:hover, .social-links a:focus {
            border-color: var(--accent-purple);
            background: rgba(106, 76, 147, 0.1);
            color: var(--accent-gold);
            outline: none;
        }

        footer p {
            font-size: 0.8rem;
            color: #665b75;
            margin: 0;
        }

        /* Decorative bohemian borders */
        .decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 1.5rem 0;
        }

        .decoration::before, .decoration::after {
            content: '';
            height: 1px;
            width: 40px;
            background: var(--accent-gold);
            opacity: 0.5;
        }

        .decoration span {
            color: var(--accent-gold);
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .container { padding: 2rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <main class="container">
        <header>
            <div class="mystic-icon" aria-hidden="true">☾</div>
            <h1>Brewing Something Special</h1>
        </header>

        <div class="content">
            <p class="subtitle">Welcome to my digital Book of Shadows. This space is currently gathering energy and will materialize when the planets align.</p>
        </div>

            <div class="decoration" aria-hidden="true">
                <span>✦</span>
            </div>

            <p class="quirky-text">Spells with the right amount of chaos and magic.</p>
        </section>

        <footer>
            <nav aria-label="Social connections">
                <ul class="social-links">
                    <li><a href="mailto:hello@yourdomain.com">Psychic Post</a></li>
                    <li><a href="#">YouTube</a></li>
                    <li><a href="#">Other Realm</a></li>
                </ul>
            </nav>
            <p>&copy; 2026. Check back when the moon is full.</p>
        </footer>
    </main>

</body>
</html>
